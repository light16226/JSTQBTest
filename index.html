<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資格試験問題集 学習サイト</title>
  <link rel="stylesheet" href="assets/styles.css">

<style>
  .timerLine{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 14px;color:var(--muted);font-weight:800}
  .timerBadge{display:inline-flex;align-items:center;gap:8px;background:#f7f9fd;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--ink)}
  .timerBadge strong{font-variant-numeric:tabular-nums;font-size:18px}
  .questionBrowser .browserControls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:12px 0}
  .questionBrowser .browserControls label{min-width:0}
  .browserMeta{color:var(--muted);font-weight:700;margin:8px 0}
  .browserPager{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin:12px 0}
  .browserPager span{color:var(--muted);font-weight:800}
  .questionCard{border:1px solid var(--line);border-radius:14px;background:#f7f9fd;margin:10px 0;overflow:hidden}
  .questionCard summary{cursor:pointer;padding:13px 15px;font-weight:800;list-style:none}
  .questionCard summary::-webkit-details-marker{display:none}
  .questionCard summary:after{content:'開く';float:right;color:var(--brand);font-size:13px}
  .questionCard[open] summary:after{content:'閉じる'}
  .questionCardBody{padding:0 15px 15px}
  .questionCardBody p{white-space:pre-wrap;margin:8px 0 12px}
  .browseOptions{margin:10px 0;padding-left:1.4em}
  .browseOptions li{margin:7px 0;padding:6px 8px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .browseOptions li.correctAnswer{border-color:var(--ok);background:#eaf8f2;font-weight:800}
  .browseExplanation{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .miniTag{display:inline-block;color:var(--muted);font-weight:800;font-size:12px;margin-left:8px}

  .controlHint{display:block;color:var(--muted);font-size:12px;font-weight:700;line-height:1.4;margin-top:2px}
  .questionTopLine{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:8px 0}
  .questionTopLine .qid{margin:0;min-width:0}
  .questionTopActions{display:flex;flex:0 1 auto;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .questionTopActions button{min-height:38px;padding:8px 12px;font-size:14px}
  .flagControls{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:44px}
  .flagControlsTop{min-height:38px;padding:5px 7px}
  .flagControlsTop .flagLabel{font-size:12px}
  .flagLabel{color:var(--muted);font-weight:800;font-size:13px;white-space:nowrap}
  .flagCheck{--flag-color:#2457d6;--flag-bg:#eef3ff;--flag-checked:#2457d6;display:inline-flex;flex-direction:row;align-items:center;gap:5px;min-width:auto;color:var(--ink);font-weight:800;padding:4px 7px;border:1px solid var(--flag-color);border-radius:999px;background:var(--flag-bg);line-height:1.2;cursor:pointer}
  .flagGreen{--flag-color:#1f9d55;--flag-bg:#e7f7ee;--flag-checked:#1f9d55}
  .flagYellow{--flag-color:#d99a00;--flag-bg:#fff6d8;--flag-checked:#d99a00}
  .flagRed{--flag-color:#d64545;--flag-bg:#ffeded;--flag-checked:#d64545}
  .flagCheck input[type="checkbox"]{-webkit-appearance:none;appearance:none;display:grid;place-content:center;inline-size:18px;block-size:18px;width:18px;height:18px;min-inline-size:18px;min-block-size:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;margin:0;padding:0;flex:0 0 18px;align-self:center;border:2px solid var(--flag-color);border-radius:5px;background:var(--flag-bg);box-shadow:0 0 0 1px rgba(255,255,255,.75) inset}
  .flagCheck input[type="checkbox"]::before{content:"";width:10px;height:10px;transform:scale(0);transition:transform .12s ease-in-out;background:#fff;clip-path:polygon(14% 44%,0 60%,40% 100%,100% 20%,84% 6%,38% 68%)}
  .flagCheck input[type="checkbox"]:checked{background:var(--flag-checked);border-color:var(--flag-checked)}
  .flagCheck input[type="checkbox"]:checked::before{transform:scale(1)}
  .flagCheck input[type="checkbox"]:focus-visible{outline:3px solid rgba(36,87,214,.30);outline-offset:2px}
  .flagCheck:has(input:checked){box-shadow:0 0 0 2px rgba(36,87,214,.12) inset}
  .flagGreen:has(input:checked){box-shadow:0 0 0 2px rgba(31,157,85,.22) inset}
  .flagYellow:has(input:checked){box-shadow:0 0 0 2px rgba(217,154,0,.24) inset}
  .flagRed:has(input:checked){box-shadow:0 0 0 2px rgba(214,69,69,.22) inset}

  @media(max-width:720px){
    .timerLine{display:block}.timerBadge{margin-top:8px;width:100%;justify-content:center}
    .questionBrowser .browserControls{grid-template-columns:1fr}
    .browserPager{justify-content:stretch}.browserPager button{flex:1;justify-content:center}.browserPager span{width:100%;text-align:center}
    .questionCard summary{padding-right:52px}.questionCard summary:after{margin-right:-38px}
    .questionCard summary{line-height:1.55}
    .questionCardBody{padding:0 12px 12px}
    .browseOptions{padding-left:0;list-style-position:inside}
    .browseOptions li{padding:10px;margin:8px 0;line-height:1.55}
    .browseExplanation{padding:10px;line-height:1.7}
    .miniTag{display:block;margin:4px 0 0}
    #browseSearch,#browseChapter{width:100%;min-height:48px}

    .questionTopLine{display:grid;grid-template-columns:1fr;gap:8px}
    .questionTopActions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:8px}
    .questionTopActions button{width:100%;min-height:44px;font-size:15px}
    .questionTopActions .flagControls{grid-column:1 / -1}
    .flagControls{width:100%;justify-content:space-between;gap:6px;padding:8px}
    .flagControlsTop{padding:8px}
    .flagLabel{width:100%;font-size:12px}
    .flagControlsTop .flagLabel{width:auto;font-size:12px}
    .flagCheck{flex:1 1 0;justify-content:center;padding:8px 6px}
    .flagCheck input[type="checkbox"]{inline-size:18px;block-size:18px;width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px}
  }
</style>
</head>
<body>
<header class="hero">
  <div>
    <p class="eyebrow">JSTQB</p>
    <h1>資格試験問題集 学習サイト</h1>
    <p>問題は <code>data/questions_1.json</code>〜<code>data/questions_6.json</code>、解答ログはブラウザ保存＋JSON出力に対応しています。</p>
  </div>
  <div class="heroStats">
    <span id="totalQuestions">0</span><small>問題</small>
  </div>
</header>

<main>
  <section class="panel controls">
    <label>章
      <select id="chapterSelect"></select>
    </label>
    <label>出題数
      <input id="questionLimit" type="number" min="1" value="10">
    </label>
    <label class="check"><input id="shuffleQuestions" type="checkbox" checked> 問題をシャッフル</label>
    <label class="check"><input id="shuffleOptions" type="checkbox" checked> 選択肢をシャッフル</label>
    <label>色チェック出題
      <select id="flagFilter">
        <option value="all">すべての問題</option>
        <option value="unmarked">どの色にもチェックなし</option>
        <option value="marked">いずれかの色にチェック済み</option>
        <option value="green">緑にチェック済み</option>
        <option value="yellow">黄色にチェック済み</option>
        <option value="red">赤にチェック済み</option>
      </select>
      <span id="flagFilterHint" class="controlHint">色チェック条件: 読み込み中...</span>
    </label>
    <label>回答状況出題
      <select id="answerStatusFilter">
        <option value="all">すべての問題</option>
        <option value="wrongEver">間違えた問題のみ</option>
        <option value="unanswered">未回答の問題のみ</option>
      </select>
      <span id="answerStatusFilterHint" class="controlHint">回答状況条件: 読み込み中...</span>
    </label>
    <button id="startBtn">学習開始</button>
  </section>

  <section id="quizPanel" class="panel quiz hidden">
    <div class="progressLine"><span id="progressText"></span><span id="scoreText"></span></div>
    <div class="timerLine"><span id="questionTimeHint">この問題の経過時間</span><span class="timerBadge">⏱ <strong id="questionTimer">00:00</strong></span></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="questionTopLine">
      <p id="qid" class="qid"></p>
      <div class="questionTopActions">
        <button id="nextBtnTop" class="secondary" disabled>次へ</button>
        <button id="finishBtnTop" class="ghost">終了してログへ</button>
        <div class="questionFlagControls flagControls flagControlsTop" aria-label="この問題の色チェック（上部）">
          <span class="flagLabel"></span>
          <label class="flagCheck flagGreen"><input type="checkbox" data-flag="green"> </label>
          <label class="flagCheck flagYellow"><input type="checkbox" data-flag="yellow"> </label>
          <label class="flagCheck flagRed"><input type="checkbox" data-flag="red"> </label>
        </div>
      </div>
    </div>
    <h2 id="questionText"></h2>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions">
      <button id="nextBtn" class="secondary" disabled>次へ</button>
      <button id="finishBtn" class="ghost">終了してログへ</button>
      <div class="questionFlagControls flagControls flagControlsBottom" aria-label="この問題の色チェック（下部）">
        <span class="flagLabel"></span>
        <label class="flagCheck flagGreen"><input type="checkbox" data-flag="green"> </label>
        <label class="flagCheck flagYellow"><input type="checkbox" data-flag="yellow"> </label>
        <label class="flagCheck flagRed"><input type="checkbox" data-flag="red"> </label>
      </div>
    </div>
  </section>

  <section id="summaryPanel" class="panel hidden">
    <h2>今回の結果</h2>
    <div class="cards">
      <div><strong id="sumTotal">0</strong><span>回答</span></div>
      <div><strong id="sumCorrect">0</strong><span>正答</span></div>
      <div><strong id="sumAccuracy">0%</strong><span>正答率</span></div>
      <div><strong id="sumTimeTotal">00:00</strong><span>合計時間</span></div>
      <div><strong id="sumTimeAvg">00:00</strong><span>平均/問</span></div>
    </div>
  </section>

  <section id="questionBrowserPanel" class="panel questionBrowser">
    <div class="sectionHead">
      <h2>全問題一覧</h2>
      <div class="actions inline">
        <button id="toggleQuestionBrowser" class="secondary">一覧を表示</button>
      </div>
    </div>
    <div id="questionBrowserContent" class="hidden">
      <p class="note">全問題の問題文・選択肢・正答・解説を確認できます。スマホで重くならないよう、50問ずつ表示します。</p>
      <div class="browserControls">
        <label>章で絞り込み
          <select id="browseChapter"><option value="すべて">すべて</option></select>
        </label>
        <label>キーワード検索
          <input id="browseSearch" type="search" placeholder="問題ID・本文・選択肢・解説を検索">
        </label>
        <button id="browseReset" class="ghost">条件クリア</button>
      </div>
      <div id="browserMeta" class="browserMeta">読み込み中...</div>
      <div class="browserPager">
        <button id="browsePrev" class="ghost">前へ</button>
        <span id="browsePageInfo">1 / 1</span>
        <button id="browseNext" class="ghost">次へ</button>
      </div>
      <div id="browserResults"></div>
      <div class="browserPager">
        <button id="browsePrevBottom" class="ghost">前へ</button>
        <span id="browsePageInfoBottom">1 / 1</span>
        <button id="browseNextBottom" class="ghost">次へ</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="sectionHead">
      <h2>解答ログ</h2>
      <div class="actions inline">
        <button id="exportLogs" class="secondary">logs.jsonを書き出し</button>
        <label class="fileBtn">logs.jsonを読み込み<input id="importLogs" type="file" accept="application/json"></label>
        <button id="clearLogs" class="danger">ログ削除</button>
      </div>
    </div>
    <div id="logStats" class="logStats"></div>
    <div class="tableWrap"><table id="logTable"><thead><tr><th>日時</th><th>問題No</th><th>章</th><th>時間</th><th>結果</th><th>あなたの解答</th><th>正答</th></tr></thead><tbody></tbody></table></div>
  </section>

</main>
<script src="data/data.js"></script>
<script src="assets/app.js?v=20260707-fix1"></script>
<script>
(function(){
  let questionStartedAt=0;
  let timerId=null;
  let browserPage=1;
  const PAGE_SIZE=50;
  const FLAG_STORAGE_KEY='jstqbQuestionFlags_v1';
  const FLAG_KEYS=['green','yellow','red'];
  let questionFlags=readQuestionFlags();

  function byId(id){return document.getElementById(id);}
  function formatMs(ms){
    ms=Math.max(0,Number(ms)||0);
    const total=Math.floor(ms/1000);
    const min=Math.floor(total/60);
    const sec=total%60;
    return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  function readElapsedMs(rec){
    if(!rec) return 0;
    if(typeof rec.elapsedMs==='number') return rec.elapsedMs;
    if(typeof rec.timeMs==='number') return rec.timeMs;
    if(typeof rec.elapsedSec==='number') return rec.elapsedSec*1000;
    if(typeof rec.timeSec==='number') return rec.timeSec*1000;
    return 0;
  }

  function safeExplanationWithSource(q){
    try{
      if(typeof explanationWithSource==='function') return explanationWithSource(q);
    }catch(e){
      console.error('Failed to build explanation text.',e);
    }
    const exp=String(q&&q.explanation||'なし');
    const basis=String(q&&q.sourceBasis||'').trim();
    if(!basis) return exp;
    if(/\n根拠:\s*$/.test(exp)||/根拠:\s*$/.test(exp)) return exp+basis;
    return exp+'\n根拠: '+basis;
  }

  function safeRecordAnswer(q,selectedIndex,shownSelectedIndex,ok,elapsedMs){
    let rec=null;
    try{
      if(typeof makeAnswerLogRecord==='function'){
        rec=makeAnswerLogRecord(q,selectedIndex>=0?selectedIndex:null,shownSelectedIndex,ok,elapsedMs);
      }else{
        rec={
          timestamp:new Date().toISOString(),
          id:q.id,
          chapter:q.chapter,
          selectedIndex:selectedIndex>=0?selectedIndex:null,
          shownSelectedIndex,
          correct:ok,
          elapsedMs:Math.round(elapsedMs||0),
          sessionId:state.sessionId
        };
      }
      if(typeof recordAnswerForCurrentQuestion==='function'){
        recordAnswerForCurrentQuestion(rec);
      }else if(state&&Array.isArray(state.session)){
        state.session.push(rec);
      }
    }catch(e){
      console.error('Failed to record answer, but continuing quiz display.',e);
      try{
        if(rec&&state&&Array.isArray(state.session)&&!state.session.includes(rec)) state.session.push(rec);
      }catch(innerError){
        console.error('Failed to keep answer in the current session.',innerError);
      }
    }
  }

  function readQuestionFlags(){
    try{
      const parsed=JSON.parse(localStorage.getItem(FLAG_STORAGE_KEY)||'{}');
      return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};
    }catch(e){
      return {};
    }
  }
  function saveQuestionFlags(){
    try{localStorage.setItem(FLAG_STORAGE_KEY,JSON.stringify(questionFlags));}
    catch(e){console.warn('Failed to save question flags.',e);}
  }
  function normalizeFlags(flags){
    return {
      green:!!(flags&&flags.green),
      yellow:!!(flags&&flags.yellow),
      red:!!(flags&&flags.red)
    };
  }
  function flagsForQuestion(id){
    return normalizeFlags(questionFlags[String(id)]);
  }
  function writeFlagsForQuestion(id,flags){
    if(!id) return;
    const normalized=normalizeFlags(flags);
    const hasAny=FLAG_KEYS.some(k=>normalized[k]);
    if(hasAny){
      questionFlags[String(id)]={...normalized,updatedAt:new Date().toISOString()};
    }else{
      delete questionFlags[String(id)];
    }
    saveQuestionFlags();
    updateFlagFilterHint();
  }
  function questionMatchesFlagFilter(q,filter){
    const flags=flagsForQuestion(q.id);
    const hasAny=FLAG_KEYS.some(k=>flags[k]);
    if(filter==='green'||filter==='yellow'||filter==='red') return !!flags[filter];
    if(filter==='marked') return hasAny;
    if(filter==='unmarked') return !hasAny;
    return true;
  }
  function statsForQuestion(q){
    if(state.logs) updateStats();
    return state.logs&&state.logs.questionStats?state.logs.questionStats[String(q.id)]||null:null;
  }
  function questionMatchesAnswerStatusFilter(q,filter){
    const stat=statsForQuestion(q);
    const answered=!!(stat&&Number(stat.answered)>0);
    if(filter==='wrongEver') return !!(stat&&Number(stat.incorrect)>0);
    if(filter==='unanswered') return !answered;
    return true;
  }
  function questionsForChapter(){
    const chap=byId('chapterSelect')?.value||ALL_CHAPTERS;
    return chap===ALL_CHAPTERS?state.questions:state.questions.filter(q=>q.chapter===chap);
  }
  function questionsForCurrentFilters(){
    const flagFilter=byId('flagFilter')?.value||'all';
    const answerStatusFilter=byId('answerStatusFilter')?.value||'all';
    return questionsForChapter().filter(q=>questionMatchesFlagFilter(q,flagFilter)&&questionMatchesAnswerStatusFilter(q,answerStatusFilter));
  }
  function updateFlagFilterHint(){
    const flagHint=byId('flagFilterHint');
    const statusHint=byId('answerStatusFilterHint');
    if(!state.questions.length) return;
    const chapterQuestions=questionsForChapter();
    const flagFilter=byId('flagFilter')?.value||'all';
    const answerStatusFilter=byId('answerStatusFilter')?.value||'all';
    const flagCount=chapterQuestions.filter(q=>questionMatchesFlagFilter(q,flagFilter)).length;
    const statusCount=chapterQuestions.filter(q=>questionMatchesAnswerStatusFilter(q,answerStatusFilter)).length;
    const combinedCount=questionsForCurrentFilters().length;
    if(flagHint) flagHint.textContent=`色チェック条件: ${flagCount}問 / 全条件: ${combinedCount}問`;
    if(statusHint) statusHint.textContent=`回答状況条件: ${statusCount}問 / 全条件: ${combinedCount}問`;
    const limit=byId('questionLimit');
    if(limit&&combinedCount>0){
      limit.max=combinedCount;
      if(Number(limit.value)>combinedCount) limit.value=combinedCount;
    }
  }
  function syncTopNextButton(){
    const top=byId('nextBtnTop');
    const bottom=byId('nextBtn');
    if(top&&bottom) top.disabled=bottom.disabled;
  }
  function syncFlagCheckboxesForCurrentQuestion(){
    const q=state.pool[state.idx];
    if(!q) return;
    const flags=flagsForQuestion(q.id);
    for(const key of FLAG_KEYS){
      document.querySelectorAll(`.questionFlagControls input[data-flag="${key}"]`).forEach(input=>{
        input.checked=!!flags[key];
      });
    }
  }
  async function startWithFlagFilter(){
    await loadSelectedQuestions();
    let qs=questionsForCurrentFilters();
    if(!qs.length){
      alert('現在の章・色チェック・回答状況条件に一致する問題がありません。');
      updateFlagFilterHint();
      return;
    }
    if(byId('shuffleQuestions').checked) qs=shuffle(qs);
    const limit=Math.max(1,Math.min(Number(byId('questionLimit').value)||10,qs.length));
    state.pool=qs.slice(0,limit).map(q=>({...q, shownOptions:byId('shuffleOptions').checked?shuffle(q.options):q.options}));
    state.idx=0;
    state.score=0;
    state.session=[];
    state.selected=null;
    state.sessionId=`s_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
    byId('summaryPanel').classList.add('hidden');
    byId('quizPanel').classList.remove('hidden');
    showQuestion();
  }
  function stopTimer(){
    if(timerId){clearInterval(timerId); timerId=null;}
  }
  function updateTimer(){
    const el=byId('questionTimer');
    if(!el) return;
    el.textContent=formatMs(Date.now()-questionStartedAt);
  }
  function startTimer(){
    stopTimer();
    questionStartedAt=Date.now();
    updateTimer();
    timerId=setInterval(updateTimer,250);
  }

  function scrollToProgressText(){
    const quizPanel=byId('quizPanel');
    const progressText=byId('progressText');
    const target=progressText?.closest('.progressLine')||progressText;
    if(!quizPanel||!target||quizPanel.classList.contains('hidden')) return;
    requestAnimationFrame(()=>{
      target.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }

  const originalNext=next;
  next=function(){
    originalNext();
    scrollToProgressText();
  };

  const originalShowQuestion=showQuestion;
  showQuestion=function(){
    originalShowQuestion();
    syncTopNextButton();
    syncFlagCheckboxesForCurrentQuestion();
    startTimer();
  };

  answer=function(btn){
    if(state.selected!==null) return;
    stopTimer();
    const elapsedMs=questionStartedAt?Date.now()-questionStartedAt:0;
    const q=state.pool[state.idx];
    const shownSelectedIndex=Number(btn.dataset.i);
    const chosen=q.shownOptions[shownSelectedIndex];
    const selectedIndex=q.options.indexOf(chosen);
    const ok=chosen===q.answer;
    state.selected=chosen;
    if(ok) state.score++;

    document.querySelectorAll('.option').forEach(b=>{
      const val=b.textContent;
      if(val===q.answer)b.classList.add('correct');
      if(b===btn&&!ok)b.classList.add('wrong');
      b.disabled=true;
    });

    safeRecordAnswer(q,selectedIndex,shownSelectedIndex,ok,elapsedMs);

    const timer=byId('questionTimer');
    if(timer) timer.textContent=formatMs(elapsedMs);
    byId('feedback').classList.remove('hidden');
    byId('feedback').textContent=(ok?'正解です。':'不正解です。')+'\n\n所要時間: '+formatMs(elapsedMs)+'\n\n正答: '+q.answer+'\n\n解説:\n'+safeExplanationWithSource(q);
    byId('nextBtn').disabled=false;
    syncTopNextButton();
    try{renderLogs();}
    catch(e){console.error('Failed to render logs, but continuing quiz display.',e);}
  };

  function applySummaryTime(){
    const total=state.session.length;
    const totalMs=state.session.reduce((sum,x)=>sum+readElapsedMs(x),0);
    if(byId('sumTimeTotal')) byId('sumTimeTotal').textContent=formatMs(totalMs);
    if(byId('sumTimeAvg')) byId('sumTimeAvg').textContent=total?formatMs(totalMs/total):'00:00';
    if(state.logs&&state.logs.sessions&&state.logs.sessions[0]){
      state.logs.sessions[0].totalTimeMs=totalMs;
      state.logs.sessions[0].averageTimeMs=total?Math.round(totalMs/total):0;
      saveLogs();
    }
  }

  finish=function(){
    stopTimer();
    byId('quizPanel').classList.add('hidden');
    byId('summaryPanel').classList.remove('hidden');
    const total=state.session.length;
    const correct=state.session.filter(x=>x.correct).length;
    const totalMs=state.session.reduce((sum,x)=>sum+readElapsedMs(x),0);
    byId('sumTotal').textContent=total;
    byId('sumCorrect').textContent=correct;
    byId('sumAccuracy').textContent=total?Math.round(correct/total*100)+'%':'0%';
    if(byId('sumTimeTotal')) byId('sumTimeTotal').textContent=formatMs(totalMs);
    if(byId('sumTimeAvg')) byId('sumTimeAvg').textContent=total?formatMs(totalMs/total):'00:00';
    state.logs.sessions.unshift({
      timestamp:new Date().toISOString(),
      total,
      correct,
      incorrect:total-correct,
      accuracy:total?correct/total:0,
      totalTimeMs:totalMs,
      averageTimeMs:total?Math.round(totalMs/total):0,
      questionIds:state.session.map(x=>x.id)
    });
    saveLogs();
    renderLogs();
  };

  byId('finishBtn').addEventListener('click',()=>{
    stopTimer();
    applySummaryTime();
  });
  byId('nextBtn')?.addEventListener('click',scrollToProgressText);
  byId('nextBtnTop')?.addEventListener('click',next);
  byId('finishBtnTop')?.addEventListener('click',()=>{
    stopTimer();
    finish();
  });
  byId('startBtn')?.addEventListener('click',e=>{
    e.preventDefault();
    e.stopImmediatePropagation();
    startWithFlagFilter();
  },true);
  byId('flagFilter')?.addEventListener('change',updateFlagFilterHint);
  byId('answerStatusFilter')?.addEventListener('change',updateFlagFilterHint);
  byId('chapterSelect')?.addEventListener('change',()=>setTimeout(updateFlagFilterHint,0));
  document.querySelectorAll('.questionFlagControls input[data-flag]').forEach(input=>{
    input.addEventListener('change',()=>{
      const q=state.pool[state.idx];
      if(!q) return;
      const flags=flagsForQuestion(q.id);
      flags[input.dataset.flag]=input.checked;
      writeFlagsForQuestion(q.id,flags);
      syncFlagCheckboxesForCurrentQuestion();
    });
  });
  setTimeout(updateFlagFilterHint,0);

  renderLogs=function(){
    if(!state.logs)return;
    updateStats();
    const s=state.logs.stats;
    const answeredWithTime=state.logs.answers.filter(r=>readElapsedMs(r)>0);
    const avgMs=answeredWithTime.length?answeredWithTime.reduce((sum,r)=>sum+readElapsedMs(r),0)/answeredWithTime.length:0;
    byId('logStats').textContent=`累計回答数 ${s.total} / 累計正答数 ${s.correct} / 累計誤答数 ${s.incorrect} / 累計正答率 ${Math.round(s.accuracy*100)}% / 平均時間 ${formatMs(avgMs)}`;
    const tbody=byId('logTable').querySelector('tbody');
    tbody.innerHTML=state.logs.answers.slice(0,200).map(r=>`<tr><td>${new Date(r.timestamp).toLocaleString('ja-JP')}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.chapter)}</td><td>${readElapsedMs(r)?formatMs(readElapsedMs(r)):'-'}</td><td class="${r.correct?'ok':'bad'}">${r.correct?'正解':'不正解'}</td><td>${escapeHtml(selectedTextForLog(r))}</td><td>${escapeHtml(answerTextForLog(r))}</td></tr>`).join('');
    updateFlagFilterHint();
  };

  function questionTextForSearch(q){
    return [q.id,q.chapter,q.section,q.learningObjective,q.question,q.answer,q.explanation,...(q.options||[])].filter(Boolean).join(' ').toLowerCase();
  }
  function filteredQuestions(){
    const chapter=byId('browseChapter')?.value||'すべて';
    const keyword=(byId('browseSearch')?.value||'').trim().toLowerCase();
    return state.questions.filter(q=>{
      const chapterOk=chapter==='すべて'||q.chapter===chapter;
      const keywordOk=!keyword||questionTextForSearch(q).includes(keyword);
      return chapterOk&&keywordOk;
    });
  }
  function renderQuestionBrowser(){
    const results=byId('browserResults');
    if(!results) return;
    const qs=filteredQuestions();
    const pages=Math.max(1,Math.ceil(qs.length/PAGE_SIZE));
    browserPage=Math.min(Math.max(1,browserPage),pages);
    const start=(browserPage-1)*PAGE_SIZE;
    const slice=qs.slice(start,start+PAGE_SIZE);
    byId('browserMeta').textContent=`${qs.length}問中 ${slice.length?start+1:0}-${start+slice.length}問を表示`;
    byId('browsePageInfo').textContent=`${browserPage} / ${pages}`;
    byId('browsePageInfoBottom').textContent=`${browserPage} / ${pages}`;
    byId('browsePrev').disabled=byId('browsePrevBottom').disabled=browserPage<=1;
    byId('browseNext').disabled=byId('browseNextBottom').disabled=browserPage>=pages;
    results.innerHTML=slice.map((q,idx)=>{
      const absoluteNo=start+idx+1;
      const opts=(q.options||[]).map((o,i)=>`<li class="${o===q.answer?'correctAnswer':''}">${escapeHtml(String.fromCharCode(65+i)+'. '+o)}${o===q.answer?' <strong>（正答）</strong>':''}</li>`).join('');
      const meta=[q.section,q.learningObjective,q.kLevel,q.questionType].filter(Boolean).map(escapeHtml).join(' / ');
      return `<details class="questionCard"><summary>${absoluteNo}. ${escapeHtml(q.id)} / ${escapeHtml(q.chapter)}${meta?`<span class="miniTag">${meta}</span>`:''}</summary><div class="questionCardBody"><p>${escapeHtml(q.question)}</p><ol class="browseOptions">${opts}</ol><div class="browseExplanation"><strong>解説</strong><br>${escapeHtml(safeExplanationWithSource(q))}</div></div></details>`;
    }).join('') || '<p class="note">該当する問題がありません。</p>';
  }
  function setupQuestionBrowser(){
    const panel=byId('questionBrowserContent');
    if(!panel || !state.questions.length) return false;
    const chapterSelect=byId('browseChapter');
    const chapters=['すべて',...new Set(state.questions.map(q=>q.chapter))];
    chapterSelect.innerHTML=chapters.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    byId('toggleQuestionBrowser').addEventListener('click',()=>{
      const isHidden=panel.classList.toggle('hidden');
      byId('toggleQuestionBrowser').textContent=isHidden?'一覧を表示':'一覧を隠す';
      if(!isHidden) renderQuestionBrowser();
    });
    byId('browseChapter').addEventListener('change',()=>{browserPage=1;renderQuestionBrowser();});
    byId('browseSearch').addEventListener('input',()=>{browserPage=1;renderQuestionBrowser();});
    byId('browseReset').addEventListener('click',()=>{byId('browseChapter').value='すべて';byId('browseSearch').value='';browserPage=1;renderQuestionBrowser();});
    const prev=()=>{browserPage--;renderQuestionBrowser();};
    const next=()=>{browserPage++;renderQuestionBrowser();};
    byId('browsePrev').addEventListener('click',prev);
    byId('browsePrevBottom').addEventListener('click',prev);
    byId('browseNext').addEventListener('click',next);
    byId('browseNextBottom').addEventListener('click',next);
    renderQuestionBrowser();
    return true;
  }

  const browserReadyCheck=setInterval(()=>{
    if(setupQuestionBrowser()){
      updateFlagFilterHint();
      clearInterval(browserReadyCheck);
    }
  },200);
})();
</script>
</body>
</html>
